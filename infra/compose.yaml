name: recantor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recantor
      POSTGRES_USER: recantor
      POSTGRES_PASSWORD: recantor
    ports:
      - "5432:5432"
    volumes:
      - recantor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recantor -d recantor"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../apps/api
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      RECANTOR_ENV: development
      DATABASE_URL: postgresql+psycopg://recantor:recantor@postgres:5432/recantor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../apps/api
    environment:
      RECANTOR_ENV: development
      DATABASE_URL: postgresql+psycopg://recantor:recantor@postgres:5432/recantor
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../apps/web
    environment:
      VITE_APP_NAME: Recantor
      VITE_API_BASE_URL: http://localhost:8000
      OPENAPI_INPUT: http://api:8000/openapi.json
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  recantor-postgres:
