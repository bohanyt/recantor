name: Updater CI

on:
  pull_request:
    branches:
      - integration/cloud-alpha-2026-09-11
    paths:
      - ".github/workflows/updater-ci.yml"
      - "scripts/recantor.ps1"
      - "scripts/test_recantor_updater.ps1"
      - "scripts/release_manifest.py"
      - "scripts/test_release_manifest.py"
      - "release/**"
      - "infra/compose.release.yaml"
      - ".github/workflows/release-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell updater unit contract
        shell: pwsh
        run: ./scripts/test_recantor_updater.ps1
      - name: Python release manifest contract
        shell: pwsh
        run: python -m unittest discover -s scripts -p "test_release_manifest.py"

  updater-docker-proof:
    needs: updater-unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROOF_SECRET: updater-proof-secret-do-not-persist
    steps:
      - uses: actions/checkout@v7

      - name: Fetch accepted N manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recantor-n
          gh release download v0.1.0-alpha.2 -R bohanyt/recantor -p release-manifest.json -D /tmp/recantor-n
          python scripts/release_manifest.py validate /tmp/recantor-n/release-manifest.json
          printf 'GROQ_API_KEY=%s\n' "$PROOF_SECRET" > .env

      - name: Install N from immutable cloud images
        shell: pwsh
        run: |
          ./scripts/recantor.ps1 install -ManifestPath /tmp/recantor-n/release-manifest.json -Channel alpha -StateDir /tmp/recantor-state -ComposeFile infra/compose.release.yaml -EnvFile .env -HealthTimeoutSeconds 90

      - name: Create representative persistent state
        shell: bash
        run: |
          set -euo pipefail
          C=(docker compose --env-file .env --env-file /tmp/recantor-state/active-images.env -f infra/compose.release.yaml)
          "${C[@]}" exec -T api sh -c 'printf updater-audio-sentinel > /data/audio/.updater-proof'
          "${C[@]}" exec -T postgres psql -U recantor -d recantor -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS updater_proof(value text PRIMARY KEY); INSERT INTO updater_proof(value) VALUES ('kept') ON CONFLICT DO NOTHING;"

      - name: Render synthetic updater candidates from accepted artifact digests
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          API_DIGEST="$(jq -r '.images.api.digest' /tmp/recantor-n/release-manifest.json)"
          WEB_DIGEST="$(jq -r '.images.web.digest' /tmp/recantor-n/release-manifest.json)"

          cat > /tmp/policy-safe-n1.json <<'JSON'
          {"application_rollback_safe_to_versions":["v0.1.0-alpha.2"],"backup_required":false}
          JSON
          python scripts/release_manifest.py render --version v0.1.0-alpha.3 --channel alpha --source-revision "$SOURCE_REVISION" --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" --schema-head 0009 --platform linux/amd64 --policy /tmp/policy-safe-n1.json --output /tmp/n1.json

          cat > /tmp/policy-safe-fail.json <<'JSON'
          {"application_rollback_safe_to_versions":["v0.1.0-alpha.3"],"backup_required":false}
          JSON
          python scripts/release_manifest.py render --version v0.1.0-alpha.4 --channel alpha --source-revision "$SOURCE_REVISION" --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" --schema-head 0009 --platform linux/amd64 --policy /tmp/policy-safe-fail.json --output /tmp/safe-fail.json

          cat > /tmp/policy-unsafe-fail.json <<'JSON'
          {"application_rollback_safe_to_versions":[],"backup_required":false}
          JSON
          python scripts/release_manifest.py render --version v0.1.0-alpha.5 --channel alpha --source-revision "$SOURCE_REVISION" --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" --schema-head 0009 --platform linux/amd64 --policy /tmp/policy-unsafe-fail.json --output /tmp/unsafe-fail.json

          cat > /tmp/fail-api.yaml <<'YAML'
          services:
            api:
              command: ["sh", "-c", "exit 42"]
          YAML

      - name: Update N to N+1 and preserve data
        shell: pwsh
        run: |
          ./scripts/recantor.ps1 update -ManifestPath /tmp/n1.json -Channel alpha -StateDir /tmp/recantor-state -ComposeFile infra/compose.release.yaml -EnvFile .env -HealthTimeoutSeconds 90

      - name: Assert successful N to N+1 state
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.current.version' /tmp/recantor-state/state.json)" = "v0.1.0-alpha.3"
          test "$(jq -r '.previous.version' /tmp/recantor-state/state.json)" = "v0.1.0-alpha.2"
          test "$(jq -r '.last_attempt.result' /tmp/recantor-state/state.json)" = "success"
          C=(docker compose --env-file .env --env-file /tmp/recantor-state/active-images.env -f infra/compose.release.yaml)
          test "$("${C[@]}" exec -T api cat /data/audio/.updater-proof)" = "updater-audio-sentinel"
          "${C[@]}" exec -T postgres psql -U recantor -d recantor -Atc "SELECT value FROM updater_proof WHERE value='kept'" | grep -qx kept

      - name: Inject rollback-safe activation failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RECANTOR_UPDATER_TEST_MODE=1 pwsh ./scripts/recantor.ps1 update -ManifestPath /tmp/safe-fail.json -Channel alpha -StateDir /tmp/recantor-state -ComposeFile infra/compose.release.yaml -EnvFile .env -HealthTimeoutSeconds 10 -TestCandidateComposeOverride /tmp/fail-api.yaml
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(jq -r '.current.version' /tmp/recantor-state/state.json)" = "v0.1.0-alpha.3"
          test "$(jq -r '.pending' /tmp/recantor-state/state.json)" = "null"
          test "$(jq -r '.last_attempt.result' /tmp/recantor-state/state.json)" = "rolled_back_to_previous_known_good"
          curl -fsS http://127.0.0.1:8000/readyz >/dev/null
          curl -fsS http://127.0.0.1:5173/ >/dev/null

      - name: Inject rollback-unsafe activation failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RECANTOR_UPDATER_TEST_MODE=1 pwsh ./scripts/recantor.ps1 update -ManifestPath /tmp/unsafe-fail.json -Channel alpha -StateDir /tmp/recantor-state -ComposeFile infra/compose.release.yaml -EnvFile .env -HealthTimeoutSeconds 10 -TestCandidateComposeOverride /tmp/fail-api.yaml
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(jq -r '.current.version' /tmp/recantor-state/state.json)" = "v0.1.0-alpha.3"
          test "$(jq -r '.pending.phase' /tmp/recantor-state/state.json)" = "manual_recovery_required"
          test "$(jq -r '.last_attempt.result' /tmp/recantor-state/state.json)" = "rollback_refused_unsafe"

      - name: Prove data and secrets survive unsafe refusal
        shell: bash
        run: |
          set -euo pipefail
          C=(docker compose --env-file .env --env-file /tmp/recantor-state/active-images.env -f infra/compose.release.yaml)
          "${C[@]}" exec -T postgres psql -U recantor -d recantor -Atc "SELECT value FROM updater_proof WHERE value='kept'" | grep -qx kept
          test "$("${C[@]}" run --rm --no-deps --entrypoint sh api -c 'cat /data/audio/.updater-proof')" = "updater-audio-sentinel"
          if grep -R --fixed-strings "$PROOF_SECRET" /tmp/recantor-state; then
            echo "secret leaked into updater state" >&2
            exit 1
          fi
          ! grep -Eq 'alembic[[:space:]]+downgrade|down[[:space:]]+-v' scripts/recantor.ps1

      - name: Cleanup proof stack
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/recantor-state/active-images.env ]]; then
            docker compose --env-file .env --env-file /tmp/recantor-state/active-images.env -f infra/compose.release.yaml down -v --remove-orphans || true
          else
            docker compose -f infra/compose.release.yaml down -v --remove-orphans || true
          fi
