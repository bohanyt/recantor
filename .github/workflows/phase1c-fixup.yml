name: Phase 1C fixup

on:
  pull_request:

permissions:
  contents: write

jobs:
  phase1c-fixup:
    if: >-
      github.head_ref == 'phase1/capture-generation-fencing' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
          run_install: false
      - name: Install dependencies
        run: |
          uv sync --project apps/api --frozen --dev
          pnpm --dir apps/web install --frozen-lockfile
      - name: Format backend and web
        run: |
          uv run --project apps/api ruff check --fix apps/api
          uv run --project apps/api ruff format apps/api
          pnpm --dir apps/web format
      - name: Commit fixups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Format Phase 1C sources"
          git push origin "HEAD:${{ github.head_ref }}"
