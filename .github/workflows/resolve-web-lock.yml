name: Resolve web lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  resolve-web-lockfile:
    if: >-
      github.head_ref == 'phase1/browser-recorder' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
          run_install: false
      - name: Resolve web lockfile
        run: pnpm --dir apps/web install --lockfile-only --no-frozen-lockfile
      - name: Commit resolved lockfile when changed
        run: |
          if [ -z "$(git status --porcelain -- apps/web/pnpm-lock.yaml)" ]; then
            echo "Web lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/pnpm-lock.yaml
          git commit -m "Update Phase 1B web dependency lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
