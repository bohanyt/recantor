name: Format Phase 1B

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-phase1b:
    if: >-
      github.head_ref == 'phase1/browser-recorder' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
          run_install: false
      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Format web sources
        run: pnpm --dir apps/web format
      - name: Commit formatting when changed
        run: |
          if [ -z "$(git status --porcelain -- apps/web)" ]; then
            echo "Web sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "Format Phase 1B web sources"
          git push origin "HEAD:${{ github.head_ref }}"
