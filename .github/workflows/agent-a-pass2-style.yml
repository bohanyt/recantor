name: Agent A PASS 2 style normalization

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.10.0'
      - run: uv sync --project apps/api --frozen --dev
      - run: |
          uv run --project apps/api ruff check --fix apps/api
          uv run --project apps/api ruff format apps/api
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'style(stt): normalize PASS 2 fixes'
          git push origin HEAD:${GITHUB_REF_NAME}
