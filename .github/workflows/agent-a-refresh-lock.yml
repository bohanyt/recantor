name: Agent A refresh API lock

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.10.0'
      - name: Refresh frozen API lock
        run: uv lock --project apps/api
      - name: Upload refreshed lock
        uses: actions/upload-artifact@v6
        with:
          name: agent-a-uv-lock
          path: apps/api/uv.lock
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- apps/api/uv.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/uv.lock
          git commit -m 'build: refresh API dependency lock'
          git push origin HEAD:${GITHUB_REF_NAME}
