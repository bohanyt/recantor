name: Agent A PASS 2 scheduler fixes

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply routed PASS 2 scheduler fixes
        run: python .github/agent-a-pass2-fix.py
      - name: Commit routed fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/recantor/stt_jobs.py
          git commit -m 'fix(stt): bound outstanding fair admission'
          git push origin HEAD:${GITHUB_REF_NAME}
