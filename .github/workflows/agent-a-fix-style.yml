name: Agent A fix backend style

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  fix-style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.10.0'
      - name: Install API dependencies
        run: uv sync --project apps/api --frozen --dev
      - name: Apply Ruff fixes and format
        run: |
          uv run --project apps/api ruff check --fix apps/api
          uv run --project apps/api ruff format apps/api
      - name: Commit style fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'style(stt): satisfy backend checks'
          git push origin HEAD:${GITHUB_REF_NAME}
