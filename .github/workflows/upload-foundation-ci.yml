name: Upload foundation CI

on:
  pull_request:
    paths:
      - ".github/workflows/upload-foundation-ci.yml"
      - ".env.example"
      - "apps/api/**"
      - "apps/web/**"
      - "infra/compose.yaml"

permissions:
  contents: read

jobs:
  upload-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recantor
          POSTGRES_USER: recantor
          POSTGRES_PASSWORD: recantor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recantor -d recantor"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://recantor:recantor@localhost:5432/recantor
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://127.0.0.1:4173
      AUDIO_STORAGE_PATH: /tmp/recantor-upload-audio
      TUS_PUBLIC_ENDPOINT: http://127.0.0.1:1080/files/
      VITE_APP_NAME: Recantor
      VITE_API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      MEDIA_QUEUE_NAME: media-upload
      STT_QUEUE_NAME: stt-live
      STT_UPLOAD_QUEUE_NAME: stt-upload
      STT_DISPATCH_REENQUEUE_SECONDS: "1"
      GROQ_API_KEY: deterministic-ci-key
      GROQ_STT_ENDPOINT: http://127.0.0.1:8099/v1/audio/transcriptions
      GROQ_STT_MODEL: deterministic-ci-provider
      GROQ_STT_TIMEOUT_SECONDS: "10"
      UPLOAD_E2E_TRANSCRIPT_TEXT: deterministic upload fixture transcript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
          run_install: false
      - name: Install dependencies and media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
          uv sync --project apps/api --frozen --dev
          pnpm --dir apps/web install --frozen-lockfile
      - name: Prepare tusd-owned durable upload storage and database
        run: |
          docker run --rm --entrypoint sh tusproject/tusd:v2.10.0 \
            -c 'test "$(id -u)" = 1000 && test "$(id -g)" = 1000'
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0775 /tmp/recantor-upload-audio
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0775 /tmp/recantor-upload-audio/sessions
          sudo install -d -o 1000 -g 1000 -m 0775 /tmp/recantor-upload-audio/uploads/tus
          test "$(stat -c '%u:%g %a' /tmp/recantor-upload-audio)" = "$(id -u):$(id -g) 775"
          test "$(stat -c '%u:%g %a' /tmp/recantor-upload-audio/sessions)" = "$(id -u):$(id -g) 775"
          test "$(stat -c '%u:%g %a' /tmp/recantor-upload-audio/uploads/tus)" = "1000:1000 775"
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - name: Start API
        run: |
          uv run --project apps/api uvicorn recantor.main:app --host 127.0.0.1 --port 8000 > /tmp/recantor-upload-api.log 2>&1 &
          echo $! > /tmp/recantor-upload-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/recantor-upload-api.log
          exit 1
      - name: Start real tusd against shared durable storage
        run: |
          docker run --detach --name recantor-upload-tusd --network host \
            --user 1000:1000 \
            --volume /tmp/recantor-upload-audio:/data/audio \
            tusproject/tusd:v2.10.0 \
            -host=127.0.0.1 \
            -port=1080 \
            -base-path=/files/ \
            -upload-dir=/data/audio/uploads/tus \
            -max-size=5368709120 \
            -disable-download \
            -disable-termination \
            -disable-concatenation \
            -cors-allow-origin=http://127.0.0.1:4173 \
            -cors-allow-headers=X-Recantor-Upload-Token \
            -hooks-http=http://127.0.0.1:8000/api/v1/uploads/tusd-hooks \
            -hooks-http-forward-headers=X-Recantor-Upload-Token \
            -hooks-enabled-events=pre-create,post-create,post-receive,pre-finish,post-finish \
            -hooks-http-retry=5 \
            -hooks-http-backoff=1s \
            -progress-hooks-interval=1s
          for i in {1..30}; do
            if curl -fsS -X OPTIONS http://127.0.0.1:1080/files/ \
              -H 'Origin: http://127.0.0.1:4173' \
              -H 'Access-Control-Request-Method: POST' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs recantor-upload-tusd
          exit 1
      - name: Start deterministic STT boundary and ordinary upload workers
        run: |
          cat > /tmp/recantor-fake-stt.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          TRANSCRIPT = "deterministic upload fixture transcript"

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != "/healthz":
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok")

              def do_POST(self):
                  if self.path != "/v1/audio/transcriptions":
                      self.send_error(404)
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  if length:
                      self.rfile.read(length)
                  payload = json.dumps({"text": TRANSCRIPT, "language": "id"}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(("127.0.0.1", 8099), Handler).serve_forever()
          PY
          python /tmp/recantor-fake-stt.py > /tmp/recantor-fake-stt.log 2>&1 &
          echo $! > /tmp/recantor-fake-stt.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/healthz >/dev/null

          uv run --project apps/api celery -A recantor.media_tasks:celery_app worker \
            -Q media-upload --concurrency=1 --prefetch-multiplier=1 --loglevel=INFO \
            > /tmp/recantor-media-worker.log 2>&1 &
          echo $! > /tmp/recantor-media-worker.pid
          uv run --project apps/api python -m recantor.media_reconciler \
            > /tmp/recantor-media-reconciler.log 2>&1 &
          echo $! > /tmp/recantor-media-reconciler.pid
          uv run --project apps/api celery -A recantor.stt_tasks:celery_app worker \
            -Q stt-upload --concurrency=1 --prefetch-multiplier=1 --loglevel=INFO \
            > /tmp/recantor-stt-upload-worker.log 2>&1 &
          echo $! > /tmp/recantor-stt-upload-worker.pid
          uv run --project apps/api python -m recantor.stt_reconciler \
            > /tmp/recantor-stt-reconciler.log 2>&1 &
          echo $! > /tmp/recantor-stt-reconciler.pid
          sleep 3
          for pidfile in \
            /tmp/recantor-media-worker.pid \
            /tmp/recantor-media-reconciler.pid \
            /tmp/recantor-stt-upload-worker.pid \
            /tmp/recantor-stt-reconciler.pid; do
            kill -0 "$(cat "$pidfile")"
          done
      - name: Build and start web preview
        run: |
          pnpm --dir apps/web generate:api
          pnpm --dir apps/web build
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web preview --host 127.0.0.1 --port 4173 > /tmp/recantor-upload-web.log 2>&1 &
          echo $! > /tmp/recantor-upload-web.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/recantor-upload-web.log
          exit 1
      - name: Produce formatter evidence in CI workspace
        run: |
          pnpm --dir apps/web exec prettier --write src/UploadPanel.tsx e2e/upload-corrections.spec.ts
      - name: Upload formatter evidence
        uses: actions/upload-artifact@v4
        with:
          name: q46-prettier-${{ github.sha }}
          path: |
            apps/web/src/UploadPanel.tsx
            apps/web/e2e/upload-corrections.spec.ts
          if-no-files-found: error
      - name: Browser resumability and fixture-to-visible-result proof
        run: |
          python - <<'PY'
          import math
          import struct
          import wave

          path = "/tmp/recantor-upload-e2e.wav"
          sample_rate = 16_000
          seconds = 130
          frames = bytearray()
          for index in range(sample_rate * seconds):
              sample = int(9000 * math.sin(2 * math.pi * 440 * index / sample_rate))
              frames.extend(struct.pack("<h", sample))
          with wave.open(path, "wb") as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(sample_rate)
              output.writeframes(frames)
          PY
          UPLOAD_E2E_FILE=/tmp/recantor-upload-e2e.wav \
            pnpm --dir apps/web exec playwright test \
              e2e/upload.spec.ts e2e/upload-corrections.spec.ts --workers=1
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          cat /tmp/recantor-upload-api.log || true
          cat /tmp/recantor-upload-web.log || true
          cat /tmp/recantor-fake-stt.log || true
          cat /tmp/recantor-media-worker.log || true
          cat /tmp/recantor-media-reconciler.log || true
          cat /tmp/recantor-stt-upload-worker.log || true
          cat /tmp/recantor-stt-reconciler.log || true
          docker logs recantor-upload-tusd || true
      - name: Stop upload services
        if: always()
        run: |
          docker rm -f recantor-upload-tusd >/dev/null 2>&1 || true
          for pidfile in \
            /tmp/recantor-upload-web.pid \
            /tmp/recantor-upload-api.pid \
            /tmp/recantor-fake-stt.pid \
            /tmp/recantor-media-worker.pid \
            /tmp/recantor-media-reconciler.pid \
            /tmp/recantor-stt-upload-worker.pid \
            /tmp/recantor-stt-reconciler.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" || true; fi
          done
