name: Agent A targeted reconciliation fix

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  fix-reconcile-count:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make missing-job repair count deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/recantor/stt_jobs.py')
          text = path.read_text()
          old = '''        result = await db.execute(statement)
          await db.commit()
          return max(0, result.rowcount or 0)'''
          new = '''        statement = statement.returning(STTJob.utterance_id)
          created_ids = list((await db.scalars(statement)).all())
          await db.commit()
          return len(created_ids)'''
          if old not in text:
              raise SystemExit('target reconciliation result block not found exactly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/recantor/stt_jobs.py
          git commit -m 'fix(stt): count reconciled jobs via returning'
          git push origin HEAD:${GITHUB_REF_NAME}
