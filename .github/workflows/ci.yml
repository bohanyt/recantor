name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  UV_VERSION: "0.10.0"
  PNPM_VERSION: "11.7.0"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recantor
          POSTGRES_USER: recantor
          POSTGRES_PASSWORD: recantor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recantor -d recantor"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://recantor:recantor@localhost:5432/recantor
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install API dependencies
        run: uv sync --project apps/api --frozen --dev
      - name: Ruff lint
        run: uv run --project apps/api ruff check apps/api
      - name: Ruff format
        run: uv run --project apps/api ruff format --check apps/api
      - name: Backend tests
        run: uv run --project apps/api pytest
      - name: Alembic upgrade
        run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - name: Alembic current
        run: uv run --project apps/api alembic -c apps/api/alembic.ini current
      - name: Verify Phase 2E database constraints
        run: |
          uv run --project apps/api python - <<'PY'
          from sqlalchemy import create_engine, text

          from recantor.settings import get_settings

          engine = create_engine(get_settings().database_url)
          with engine.connect() as conn:
              names = set(
                  conn.execute(
                      text(
                          "SELECT conname FROM pg_constraint "
                          "WHERE conname IN "
                          "('fk_stt_job_utterance_session', "
                          "'uq_transcription_utterance_id_session', "
                          "'ck_stt_job_claim_shape', "
                          "'ck_stt_job_retry_time_shape')"
                      )
                  ).scalars()
              )
          assert names == {
              "fk_stt_job_utterance_session",
              "uq_transcription_utterance_id_session",
              "ck_stt_job_claim_shape",
              "ck_stt_job_retry_time_shape",
          }, names
          PY
      - name: Redis protocol check
        run: |
          python - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 6379), timeout=3) as sock:
              sock.sendall(b"*1\r\n$4\r\nPING\r\n")
              reply = sock.recv(64)
          if reply != b"+PONG\r\n":
              raise SystemExit(f"unexpected Redis response: {reply!r}")
          PY
      - name: Readiness fails honestly when PostgreSQL is unavailable
        run: |
          DATABASE_URL=postgresql+psycopg://recantor:recantor@127.0.0.1:1/recantor \
            uv run --project apps/api uvicorn recantor.main:app --host 127.0.0.1 --port 8001 \
            > /tmp/recantor-api-unready.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/healthz >/dev/null; then break; fi
            sleep 1
          done
          code=$(curl -sS -o /tmp/recantor-unready.json -w "%{http_code}" http://127.0.0.1:8001/readyz)
          cat /tmp/recantor-unready.json
          test "$code" = "503"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install API dependencies for OpenAPI generation
        run: uv sync --project apps/api --frozen --dev
      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Start API for OpenAPI generation
        run: |
          uv run --project apps/api uvicorn recantor.main:app --host 127.0.0.1 --port 8000 > /tmp/recantor-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/recantor-api.log
          exit 1
      - name: Generate API client
        run: pnpm --dir apps/web generate:api
      - name: Frontend lint
        run: pnpm --dir apps/web lint
      - name: Frontend format
        run: pnpm --dir apps/web format:check
      - name: Frontend typecheck
        run: pnpm --dir apps/web typecheck
      - name: Frontend tests
        run: pnpm --dir apps/web test
      - name: Frontend build
        run: pnpm --dir apps/web build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recantor
          POSTGRES_USER: recantor
          POSTGRES_PASSWORD: recantor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recantor -d recantor"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://recantor:recantor@localhost:5432/recantor
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      VITE_APP_NAME: Recantor
      VITE_API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies
        run: |
          uv sync --project apps/api --frozen --dev
          pnpm --dir apps/web install --frozen-lockfile
      - name: Migrate database
        run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - name: Start API
        run: |
          uv run --project apps/api uvicorn recantor.main:app --host 127.0.0.1 --port 8000 > /tmp/recantor-api.log 2>&1 &
          echo $! > /tmp/recantor-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/recantor-api.log
          exit 1
      - name: Generate API client and build web
        run: |
          pnpm --dir apps/web generate:api
          pnpm --dir apps/web build
      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Start web preview
        run: |
          pnpm --dir apps/web preview --host 127.0.0.1 --port 4173 > /tmp/recantor-web.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/recantor-web.log
          exit 1
      - name: Browser smoke
        run: pnpm --dir apps/web test:e2e
      - name: API restart preserves durable recording ledger and audio
        run: |
          request_id=$(python -c 'import uuid; print(uuid.uuid4())')
          writer_id="ci-restart-writer-0001"
          recovery_token="ci-restart-recovery-capability-0001"
          session_json=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/sessions/live \
            -H 'content-type: application/json' \
            -d "{\"client_request_id\":\"$request_id\",\"writer_id\":\"$writer_id\",\"recovery_token\":\"$recovery_token\"}")
          session_id=$(SESSION_JSON="$session_json" python -c 'import json, os; print(json.loads(os.environ["SESSION_JSON"])["id"])')

          printf 'recantor-api-restart-durable-audio' > /tmp/restart-audio.webm
          sha=$(sha256sum /tmp/restart-audio.webm | awk '{print $1}')
          chunk_url="http://127.0.0.1:8000/api/v1/sessions/$session_id/chunks/1?writer_id=$writer_id&capture_epoch=1&monotonic_start_ms=0&monotonic_end_ms=1000&sha256=$sha&content_type=audio%2Fwebm"
          curl -fsS -X PUT "$chunk_url" \
            -H 'content-type: application/octet-stream' \
            --data-binary @/tmp/restart-audio.webm > /tmp/restart-first-ack.json

          kill "$(cat /tmp/recantor-api.pid)"
          for i in {1..30}; do
            if ! curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          uv run --project apps/api uvicorn recantor.main:app --host 127.0.0.1 --port 8000 > /tmp/recantor-api-restarted.log 2>&1 &
          echo $! > /tmp/recantor-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz >/dev/null || {
            cat /tmp/recantor-api-restarted.log
            exit 1
          }

          retry_json=$(curl -fsS -X PUT "$chunk_url" \
            -H 'content-type: application/octet-stream' \
            --data-binary @/tmp/restart-audio.webm)
          state_json=$(curl -fsS "http://127.0.0.1:8000/api/v1/sessions/$session_id/recording-state")
          RETRY_JSON="$retry_json" STATE_JSON="$state_json" python - <<'PY'
          import json
          import os

          retry = json.loads(os.environ["RETRY_JSON"])
          state = json.loads(os.environ["STATE_JSON"])
          assert retry["idempotent"] is True, retry
          assert state["accepted_count"] == 1, state
          assert state["highest_contiguous_sequence"] == 1, state
          assert state["accepted_ranges"] == [{"start": 1, "end": 1}], state
          PY

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Build and start development stack
        run: docker compose -f infra/compose.yaml up --build -d
      - name: Wait for API readiness and web shell
        run: |
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/compose.yaml ps
          docker compose -f infra/compose.yaml logs
          exit 1
      - name: Assert Phase 2E Compose services
        run: |
          docker compose -f infra/compose.yaml ps
          python - <<'PY'
          import json
          import subprocess

          compose = ["docker", "compose", "-f", "infra/compose.yaml"]
          config = json.loads(subprocess.check_output([*compose, "config", "--format", "json"]))
          services = config["services"]

          for service_name in ("stt-worker", "stt-reconciler"):
              container_id = subprocess.check_output(
                  [*compose, "ps", "-q", service_name], text=True
              ).strip()
              assert container_id, service_name
              running = subprocess.check_output(
                  ["docker", "inspect", "-f", "{{.State.Running}}", container_id],
                  text=True,
              ).strip()
              assert running == "true", (service_name, running)
              assert services[service_name].get("restart") == "unless-stopped"

          def audio_mount(service_name: str) -> dict:
              mounts = services[service_name].get("volumes", [])
              matches = [mount for mount in mounts if mount.get("target") == "/data/audio"]
              assert len(matches) == 1, (service_name, mounts)
              assert matches[0].get("type") == "volume", matches[0]
              return matches[0]

          api_audio = audio_mount("api")
          worker_audio = audio_mount("stt-worker")
          assert api_audio["source"] == worker_audio["source"]
          assert worker_audio.get("read_only") is True, worker_audio

          worker = services["stt-worker"]
          reconciler = services["stt-reconciler"]
          queue_name = worker.get("environment", {}).get("STT_QUEUE_NAME")
          assert queue_name == "stt-live", queue_name
          assert reconciler.get("environment", {}).get("STT_QUEUE_NAME") == queue_name
          worker_command = worker["command"]
          assert "--prefetch-multiplier=1" in worker_command, worker_command
          assert "-Q" in worker_command and queue_name in worker_command, worker_command
          assert worker.get("environment", {}).get("GROQ_API_KEY", "") == ""
          PY
      - name: Verify Celery active queue and broker-backed scheduler execution
        run: |
          docker compose -f infra/compose.yaml exec -T stt-worker python - <<'PY'
          from recantor.settings import get_settings
          from recantor.stt_tasks import celery_app

          inspector = celery_app.control.inspect(timeout=5)
          pings = inspector.ping() or {}
          queues = inspector.active_queues() or {}
          assert pings, "no Celery worker answered ping"
          expected = get_settings().stt_queue_name
          assert any(
              queue.get("name") == expected
              for worker_queues in queues.values()
              for queue in worker_queues
          ), (expected, queues)
          PY

          work_id=$(docker compose -f infra/compose.yaml exec -T api python - <<'PY'
          import asyncio
          import json
          import urllib.request
          from uuid import UUID, uuid4

          from recantor.db import get_sessionmaker
          from recantor.utterance import commit_utterance_work

          body = json.dumps(
              {
                  "client_request_id": str(uuid4()),
                  "writer_id": "ci-compose-stt-writer-0001",
                  "recovery_token": "ci-compose-stt-recovery-capability-0001",
              }
          ).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/sessions/live",
              data=body,
              headers={"content-type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              session_id = UUID(json.load(response)["id"])

          async def seed() -> None:
              async with get_sessionmaker()() as db:
                  work, _ = await commit_utterance_work(
                      db,
                      session_id=session_id,
                      producer_key="ci:compose:broker-backed-stt",
                      start_ms=0,
                      end_ms=1000,
                      content_type="audio/wav",
                      payload=b"ci-compose-durable-stt-audio",
                  )
              print(work.id)

          asyncio.run(seed())
          PY
          )
          test -n "$work_id"

          observed=""
          for i in {1..30}; do
            observed=$(docker compose -f infra/compose.yaml exec -T -e WORK_ID="$work_id" api python - <<'PY'
          import asyncio
          import os
          from uuid import UUID

          from sqlalchemy import func, select
          from recantor.db import get_sessionmaker
          from recantor.models import STTJob, TranscriptSegment
          from recantor.utterance import transcript_producer_key_for_utterance

          async def read_state() -> None:
              work_id = UUID(os.environ["WORK_ID"])
              async with get_sessionmaker()() as db:
                  job = await db.get(STTJob, work_id)
                  if job is None:
                      print("missing")
                      return
                  canonical = int(
                      await db.scalar(
                          select(func.count(TranscriptSegment.id)).where(
                              TranscriptSegment.producer_key
                              == transcript_producer_key_for_utterance(work_id)
                          )
                      )
                      or 0
                  )
                  print(
                      f"{job.state}:{job.attempt_count}:"
                      f"{job.last_error_category or ''}:{canonical}"
                  )

          asyncio.run(read_state())
          PY
            )
            if [ "$observed" = "retry_wait:1:configuration:0" ]; then
              break
            fi
            sleep 1
          done
          test "$observed" = "retry_wait:1:configuration:0" || {
            docker compose -f infra/compose.yaml logs stt-worker stt-reconciler api
            echo "unexpected STT scheduler state: $observed"
            exit 1
          }
      - name: Stop development stack
        if: always()
        run: docker compose -f infra/compose.yaml down -v
