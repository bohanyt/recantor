name: Ruff Probe

on:
  pull_request:

jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.10.0'
      - run: uv sync --project apps/api --frozen --dev
      - name: Print Ruff import diff
        run: |
          uv run --project apps/api ruff check apps/api/tests/test_realtime_audio.py --fix
          git diff -- apps/api/tests/test_realtime_audio.py
