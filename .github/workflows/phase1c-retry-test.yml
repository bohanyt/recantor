name: Phase 1C retry regression helper

on:
  push:
    branches:
      - phase1/capture-generation-fencing

permissions:
  contents: write

jobs:
  add-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
          run_install: false
      - run: pnpm --dir apps/web install --frozen-lockfile
      - name: Append retry regression test
        run: |
          cat >> apps/web/e2e/recorder.spec.ts <<'EOF'

          test('allows retry after an initial start request failure', async ({ page }) => {
            let createCalls = 0;
            await page.route('**/api/v1/sessions/live', async (route) => {
              createCalls += 1;
              if (createCalls === 1) {
                await route.abort('failed');
                return;
              }
              await route.continue();
            });

            await page.goto('/');
            await page.getByTestId('start-recording').click();
            await expect(page.getByRole('alert')).toBeVisible({ timeout: 10_000 });
            await expect(page.getByTestId('start-recording')).toBeVisible();

            await page.getByTestId('start-recording').click();
            await expect(page.getByTestId('recorder-message')).toContainText(
              'Recording capture generation 1',
              { timeout: 10_000 },
            );
            expect(createCalls).toBe(2);

            await page.waitForTimeout(2_200);
            await page.getByTestId('stop-recording').click();
            await expect(page.getByTestId('recorder-message')).toContainText('finalized', {
              timeout: 20_000,
            });
          });
          EOF
          pnpm --dir apps/web exec prettier --write e2e/recorder.spec.ts
      - name: Commit test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/recorder.spec.ts
          git commit -m "Cover retry after failed recorder start"
          git push origin HEAD:phase1/capture-generation-fencing
