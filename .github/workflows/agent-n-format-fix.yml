name: Agent N normalize issue 45

on:
  push:
    branches: [agent-n/issue-45-upload-processing]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-n/issue-45-upload-processing
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.10.0'
      - name: Apply bounded identity hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/api/src/recantor/media_processing.py')
          text = path.read_text()

          old = '''def upload_utterance_producer_key(ordinal: int, start_sample: int, end_sample: int) -> str:\n    return f"{SEGMENTATION_SPEC_ID}:{ordinal:08d}:{start_sample}:{end_sample}"\n'''
          new = '''def upload_utterance_producer_key(ordinal: int) -> str:\n    # Ordinal is the semantic slot. Timing/payload drift must conflict on the same key rather\n    # than creating an alternate overlapping utterance identity.\n    return f"{SEGMENTATION_SPEC_ID}:{ordinal:08d}"\n'''
          if old not in text:
              raise SystemExit('producer-key source shape changed')
          text = text.replace(old, new, 1)

          old = 'producer_key=upload_utterance_producer_key(ordinal, start_sample, end_sample),'
          new = 'producer_key=upload_utterance_producer_key(ordinal),'
          if text.count(old) != 1:
              raise SystemExit('producer-key call shape changed')
          text = text.replace(old, new, 1)

          # Local media only: prevent demuxers from opening secondary network protocols.
          probe_old = '''            "-of",\n            "json",\n            str(path),\n'''
          probe_new = '''            "-of",\n            "json",\n            "-protocol_whitelist",\n            "file",\n            str(path),\n'''
          if text.count(probe_old) != 1:
              raise SystemExit('ffprobe argv shape changed')
          text = text.replace(probe_old, probe_new, 1)

          ffmpeg_old = '''                "-copyts",\n                "-i",\n                str(source_path),\n'''
          ffmpeg_new = '''                "-copyts",\n                "-protocol_whitelist",\n                "file",\n                "-i",\n                str(source_path),\n'''
          if text.count(ffmpeg_old) != 1:
              raise SystemExit('ffmpeg argv shape changed')
          text = text.replace(ffmpeg_old, ffmpeg_new, 1)
          path.write_text(text)

          tests = Path('apps/api/tests/test_media_processing.py')
          test_text = tests.read_text()
          test_text = test_text.replace(
              'upload_utterance_producer_key(1, 0, 8000)',
              'upload_utterance_producer_key(1)',
          ).replace(
              'upload_utterance_producer_key(2, 8000, 16000)',
              'upload_utterance_producer_key(2)',
          )
          tests.write_text(test_text)
      - name: Format and autofix scoped Python
        run: |
          uv sync --project apps/api --frozen --dev
          uv run --project apps/api ruff check --fix apps/api || true
          uv run --project apps/api ruff format apps/api
      - name: Commit normalized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Harden deterministic upload processing identity'
          git push origin HEAD:agent-n/issue-45-upload-processing
