name: Agent A PASS 2 legacy fairness assertion

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile legacy fairness regression with outstanding admission contract
        run: python .github/agent-a-patch-legacy-fairness.py
      - name: Commit assertion reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_stt_jobs.py
          git commit -m 'test(stt): align fairness regression with outstanding cap'
          git push origin HEAD:${GITHUB_REF_NAME}
