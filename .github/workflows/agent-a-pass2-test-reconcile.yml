name: Agent A PASS 2 legacy fairness assertion

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile legacy fairness regression with outstanding admission contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/tests/test_stt_jobs.py')
          text = path.read_text()
          old = '''    assert second.dispatched == 3
    assert b_work.id in second_dispatch
    assert len(set(second_dispatch).intersection(a_ids)) == 2
'''
          new = '''    # Session A already owns both outstanding admission slots from pass 1.
    # Only newly-active session B may be published until A's expiring hints clear/claim.
    assert second.dispatched == 1
    assert second_dispatch == [b_work.id]
    assert len(set(second_dispatch).intersection(a_ids)) == 0
'''
          if old not in text:
              raise SystemExit('legacy fairness assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit assertion reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_stt_jobs.py
          git commit -m 'test(stt): align fairness regression with outstanding cap'
          git push origin HEAD:${GITHUB_REF_NAME}
