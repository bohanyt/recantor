name: Agent A PASS 2 legacy fairness assertion

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile legacy fairness regression with outstanding admission contract
        run: python -c 'from pathlib import Path; p=Path("apps/api/tests/test_stt_jobs.py"); s=p.read_text(); old="    assert second.dispatched == 3\n    assert b_work.id in second_dispatch\n    assert len(set(second_dispatch).intersection(a_ids)) == 2\n"; new="    # Session A already owns both outstanding admission slots from pass 1.\n    # Only newly-active session B may publish until those expiring hints clear or claim.\n    assert second.dispatched == 1\n    assert second_dispatch == [b_work.id]\n    assert len(set(second_dispatch).intersection(a_ids)) == 0\n"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Commit assertion reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_stt_jobs.py
          git commit -m 'test(stt): align fairness regression with outstanding cap'
          git push origin HEAD:${GITHUB_REF_NAME}
