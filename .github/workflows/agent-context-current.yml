name: agent-context-current
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited, closed, reopened]
permissions: {}
jobs:
  compile:
    uses: bohanyt/agent-context-compiler/.github/workflows/compile.yml@main
    with:
      mode: repo-current
    permissions:
      contents: write
      issues: read
      pull-requests: read
      id-token: write
