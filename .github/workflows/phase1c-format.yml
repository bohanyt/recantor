name: Phase 1C formatter

on:
  push:
    branches:
      - phase1/capture-generation-fencing

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v5
        with:
          version: "11.7.0"
          run_install: false
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec prettier --write src/recorder/controller.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/recorder/controller.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format recorder start retry guard"
          git push origin HEAD:phase1/capture-generation-fencing
