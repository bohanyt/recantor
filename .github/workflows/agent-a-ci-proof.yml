name: Agent A Phase 2E CI proof wiring

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  patch-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Strengthen exact Phase 2E CI proofs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''      - name: Alembic current
        run: uv run --project apps/api alembic -c apps/api/alembic.ini current
      - name: Redis protocol check
'''
          new = '''      - name: Alembic current
        run: uv run --project apps/api alembic -c apps/api/alembic.ini current
      - name: Verify Phase 2E database constraints
        run: |
          uv run --project apps/api python - <<'PY'
          from sqlalchemy import create_engine, text
          from recantor.settings import get_settings

          engine = create_engine(get_settings().database_url)
          with engine.connect() as conn:
              names = set(
                  conn.execute(
                      text(
                          "SELECT conname FROM pg_constraint "
                          "WHERE conname IN "
                          "('fk_stt_job_utterance_session', 'uq_transcription_utterance_id_session')"
                      )
                  ).scalars()
              )
          assert names == {
              "fk_stt_job_utterance_session",
              "uq_transcription_utterance_id_session",
          }, names
          PY
      - name: Redis protocol check
'''
          if old not in text:
              raise SystemExit('backend Alembic insertion point not found')
          text = text.replace(old, new, 1)

          old = '''      - name: Inspect Compose services
        run: docker compose -f infra/compose.yaml ps
'''
          new = '''      - name: Assert Phase 2E Compose services
        run: |
          docker compose -f infra/compose.yaml ps
          python - <<'PY'
          import json
          import subprocess

          compose = ["docker", "compose", "-f", "infra/compose.yaml"]
          config = json.loads(subprocess.check_output([*compose, "config", "--format", "json"]))
          services = config["services"]
          for service_name in ("stt-worker", "stt-reconciler"):
              container_id = subprocess.check_output(
                  [*compose, "ps", "-q", service_name], text=True
              ).strip()
              assert container_id, service_name
              running = subprocess.check_output(
                  ["docker", "inspect", "-f", "{{.State.Running}}", container_id], text=True
              ).strip()
              assert running == "true", (service_name, running)

          def audio_source(service_name: str) -> str:
              mounts = services[service_name].get("volumes", [])
              matches = [m for m in mounts if m.get("target") == "/data/audio"]
              assert len(matches) == 1, (service_name, mounts)
              assert matches[0].get("type") == "volume", matches[0]
              return matches[0]["source"]

          assert audio_source("api") == audio_source("stt-worker")
          worker_command = services["stt-worker"]["command"]
          assert "--prefetch-multiplier=1" in worker_command, worker_command
          assert services["stt-worker"].get("environment", {}).get("GROQ_API_KEY", "") == ""
          PY
'''
          if old not in text:
              raise SystemExit('Compose inspection point not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit CI proof wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'ci: assert Phase 2E migration and Compose semantics'
          git push origin HEAD:${GITHUB_REF_NAME}
