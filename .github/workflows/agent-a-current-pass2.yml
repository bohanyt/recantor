name: Agent A CURRENT PASS 2 reconciliation

on:
  push:
    branches: [agent-a/issue-38-phase2e-live-stt]

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile CURRENT with PASS 2 candidate semantics
        run: python .github/agent-a-update-current-pass2.py
      - name: Commit CURRENT reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT.md
          git commit -m 'docs: reconcile Phase 2E PASS 2 candidate semantics'
          git push origin HEAD:${GITHUB_REF_NAME}
